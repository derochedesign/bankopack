modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Bankopack"
description='''
Small tweaks for the Bankopack modpack:
- Turns Iris shaders off in listed dimensions (Ad Astra by default) and back on when you leave.
- Adds JEI mod-name aliases, so e.g. @rpg finds every RPG Series item.
- Data: sorts Simply Swords weapons into RPG Series weapon-type tags so Skill Tree's weapon branches recognise them.
- Data: tones down crit chance from Apotheosis (Intricate affix, Samurai gem) and Critical Strike (Critical Hit enchant).
- Fix: The Birth of Steve shrines and Meridian Archive are placed on dry land (wider search) and no longer buried at the bottom of the world.
Configure in config/bankopack-client.toml.
'''

[[mixins]]
config="bankopack.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

# Load after these so this mod's data overrides theirs (crit tuning, weapon-type tags).
[[dependencies.${mod_id}]]
    modId="apotheosis"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="critical_strike"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="spell_engine"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
