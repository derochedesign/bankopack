modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Bankopack"
description='''
Small client-side tweaks for the Bankopack modpack:
- Turns Iris shaders off in listed dimensions (Ad Astra by default) and back on when you leave.
- Adds JEI mod-name aliases, so e.g. @rpg finds every RPG Series item.
- Data: sorts Simply Swords weapons into RPG Series weapon-type tags so Skill Tree's weapon branches recognise them.
Configure in config/bankopack-client.toml.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
