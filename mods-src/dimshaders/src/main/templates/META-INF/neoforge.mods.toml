modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Bankopack"
description='''
Turns Iris shaders off in listed dimensions (Ad Astra planets by default) and back on when you leave.
Only re-enables shaders it turned off itself. Edit the list in config/dimshaders-client.toml.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
