[shaders]
	#Dimensions where Iris shaders are turned off automatically.
	#Use full IDs like "ad_astra:moon", or "namespace:*" for every dimension from a mod.
	dimensions = ["ad_astra:*", "the_bumblezone:the_bumblezone", "eternal_starlight:starlight"]

[jei]
	#Extra names JEI's @ mod search will match, as "alias=modid1,modid2,...".
	#Example: "rpg=wizards,rogues" makes @rpg list items from both mods. Restart the game after editing.
	mod_aliases = ["rpg=wizards,paladins,rogues,archers,jewelry,spell_engine,runes,skill_tree_rpgs,more_rpg_classes,berserker_rpg,forcemaster_rpg,witcher_rpg,elemental_wizards_rpg,bards_rpg"]
